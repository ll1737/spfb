version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: multi-publish-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - WORKER_URL=http://worker:8000
      - WORKER_API_KEY=secret_worker_token_2026
      - APP_SECRET=multi_publish_secret_key_2026
    depends_on:
      - worker
    restart: unless-stopped

  worker:
    build:
      context: ./services/worker
      dockerfile: Dockerfile
    container_name: multi-publish-worker
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - WORKER_API_KEY=secret_worker_token_2026
      - APP_SECRET=multi_publish_secret_key_2026
      - BROWSER_HEADLESS=true
    ipc: host
    restart: unless-stopped
